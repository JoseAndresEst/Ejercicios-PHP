
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de aficiones</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contenedor {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
            width: 350px;
        }

        h1 {
            text-align: center;
            color: #263248;
        }

        .opcion {
            display: block;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
        }

        .opcion:hover {
            background-color: #f0f5ff;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #2864dc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #194db2;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Mis aficiones</h1>

        <p>¿Cuáles son tus aficiones? Selecciona todas las que te gusten:</p>

        <form action="comprobar.php" method="POST">

            <label class="opcion">
                <input type="checkbox" name="deporte" value="si">
                ⚽ Practicar deporte
            </label>

            <label class="opcion">
                <input type="checkbox" name="musica" value="si">
                🎵 Escuchar música
            </label>

            <label class="opcion">
                <input type="checkbox" name="lectura" value="si">
                📚 Leer libros
            </label>

            <label class="opcion">
                <input type="checkbox" name="viajar" value="si">
                ✈️ Viajar
            </label>

            <label class="opcion">
                <input type="checkbox" name="videojuegos" value="si">
                🎮 Jugar a videojuegos
            </label>

            <button type="submit">Enviar aficiones</button>

        </form>
    </div>

</body>
</html>
