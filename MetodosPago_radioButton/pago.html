<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar método de pago</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .contenedor {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
            width: 350px;
        }

        h1 {
            text-align: center;
            color: #263248;
        }

        .opcion {
            display: block;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #2864dc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #194db2;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Método de pago</h1>

        <p>¿Qué método de pago deseas utilizar para realizar tu compra?</p>

        <form action="pago.php" method="POST">

            <label class="opcion">
                <input type="radio" name="pago"
                       value="Tarjeta de crédito o débito" required>
                💳 Tarjeta de crédito o débito
            </label>

            <label class="opcion">
                <input type="radio" name="pago" value="PayPal">
                🅿️ PayPal
            </label>

            <label class="opcion">
                <input type="radio" name="pago"
                       value="Transferencia bancaria">
                🏦 Transferencia bancaria
            </label>

            <label class="opcion">
                <input type="radio" name="pago" value="Bizum">
                📱 Bizum
            </label>

            <button type="submit">Mostrar método seleccionado</button>

        </form>
    </div>

</body>
</html>
